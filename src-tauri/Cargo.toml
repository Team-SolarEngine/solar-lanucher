[package]
name = "solarlauncher"
version = "0.8.8"
description = "launching fnf instances from deep insde your folders, now fixed!"
authors = [ "Solar Engine Team" ]
edition = "2021"
author = [ "Team Solar Engine" ]

[lib]
name = "solarlauncher_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies.tauri-build]
version = "2"
features = []

[dependencies]
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde_json = "1"
dirs = "6"
zip = "8.6.0"
futures-util = "0.3.34"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"

[dependencies.tauri]
version = "2"
features = [ "protocol-asset" ]

[dependencies.tauri-plugin-single-instance]
version = "2"
features = [ "deep-link" ]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[dependencies.reqwest]
version = "0.12"
features = [ "stream" ]

[dependencies.tokio]
version = "1"
features = [ "fs", "rt-multi-thread" ]

[target."cfg(unix)".dependencies]
libc = "0.2"
