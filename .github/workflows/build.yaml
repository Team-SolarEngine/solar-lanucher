name: Build

on:
  push:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'static/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: "x86_64-unknown-linux-gnu"
          - platform: windows-latest
            target: "x86_64-pc-windows-msvc"
          - platform: macos-latest
            target: "aarch64-apple-darwin"
          - platform: macos-latest
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Flatpak - Linux
        if: matrix.platform == 'ubuntu-latest'
        run: |
            sudo apt install flatpak flatpak-builder
            flatpak install flathub \
              org.gnome.Platform//51 \
              org.gnome.Sdk//51 \
              org.freedesktop.Sdk.Extension.node24//26.08 \
              org.freedesktop.Sdk.Extension.rust-stable//26.08 \
              --noninteractive --user

      - name: Install dependencies - Linux
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Build and Bundle for Flatpak - Linux
        if: matrix.platform == 'ubuntu-latest'
        run: |
            flatpak-builder --force-clean --user --disable-cache --repo flatpak-repo flatpak-build net.solarengine.solarlauncher.yml
            flatpak build-bundle $(pwd)/flatpak-repo $(pwd)/solarlauncher.flatpak net.solarengine.solarlauncher

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solarlauncher-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: |
            src-tauri/target/*/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
            solarlauncher.flatpak
          if-no-files-found: warn