name: Update Translation Needed
title: "[IMPORTANT] UPDATE TRANSLATIONS NEEDED"
description: Request all translators to update their translation. Do not use this.
labels: [translation]

assignees:
  - daveberrys           # Malay
  - VideoBotYT           # Belgium
  - BaranMuzu            # Turkish
  - CharGoldenYT         # lolcat
  - sirthegamercoderr    # Indonesia

body:
  - type: checkboxes
    id: iwillnotuse
    attributes:
      label: "This issue is only meant to serve as needing to update translation."
      description: "Do not use this if you are not Daveberry or the contributors."
      options:
        - label: "I am not Daveberry or any of the contributors."
    validations:
      required: true

  - type: input
    id: translators
    attributes:
      label: Ping all translators here.
      description: They will be notified.
      value: "@daveberrys @VideoBotYT @BaranMuzu @CharGoldenYT @sirthegamercoderr"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: "# ATTENTION ALL TRANSLATORS"
      value: |
        A new key has been added and we need you all to add your translation in the JSON format.

        The key that has been added:
        - [insert key]: [insert english translation]

        Please send a PR or send it in this issue thread.
    validations:
      required: true